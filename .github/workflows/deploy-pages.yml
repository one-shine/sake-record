name: Deploy to GitHub Pages

# main への push で dist をビルドし GitHub Pages へ自動公開。
# Pages 側の設定は Source: GitHub Actions(リポジトリ Settings → Pages)。
#
# workflow_call を持たせている理由: さけのわデータの月次更新ジョブ(update-sakenowa.yml)が
# GITHUB_TOKEN でコミットバックしても、そのコミットは他 workflow の `on: push` を再トリガしない。
# PAT や repository_dispatch を使わずに済ませるため、更新ジョブからこれを直接呼ぶ。
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# 並行デプロイを抑止(進行中はキャンセルせず最新を待つ)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install (clean)
        run: npm ci
      - name: Build
        run: npm run build
      # クレジット(さけのわ / CC-BY)と noindex が成果物に入っているかを公開前に確認する
      - name: Check attribution
        run: npm run attribution:check
      # 静的成果物として配信(Jekyll 処理を無効化する保険)
      - name: Disable Jekyll
        run: touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
