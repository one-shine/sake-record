name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install (clean)
        run: npm ci
      # ローカルの `npm run ci` と同一定義。CI だけで通る/落ちる状態を作らない。
      # 中身: invariants(data:check + naming:check) → lint → build → attribution:check → test
      - name: Verify
        run: npm run ci
      - name: Audit
        run: npm audit --audit-level=high
