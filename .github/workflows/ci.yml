name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # **`package.json` の `engines.node`(>=22.18 / 23.6+)を満たす必要がある**(BACKLOG B23)。
          # `scripts/import-sake-log.mjs` が TS を直接 import する = 型ストリップが要るため。
          # ここは系列指定なので setup-node が 22 系の**最新**に解決する(22.18 以上になる)。
          # ずれたら `npm run ci` の先頭(node:check)がこのファイルを読んで落とす — コメントではなく検査で守る。
          node-version: '22'
          cache: npm
      - name: Install (clean)
        run: npm ci
      # ローカルの `npm run ci` と同一定義。CI だけで通る/落ちる状態を作らない。
      # 中身: invariants(node:check + data:check + naming:check + ledger:check) → lint →
      #       boundaries:check(依存方向の lint ルールが効いているかの自己検査 / B21) → build →
      #       attribution:check → test:report → skips:check(skip の可視化)
      #
      # **CI で一度も走らないもの**(隠さずここに書く):
      #   - `npm run import:sake-log` … 元 markdown がリポジトリ外(brain)。B23
      #   - `src/integration/` の3ファイル … `data/seed/`(個人の台帳・gitignore)が無いので
      #     `describe.skipIf` で丸ごと skip される。**実測値 203 / 65 / 22 / 185 / 190 は
      #     CI では未検証**。最後の skips:check が件数と場所をログとジョブ要約に出す。
      - name: Verify
        run: npm run ci
      - name: Audit
        run: npm audit --audit-level=high
